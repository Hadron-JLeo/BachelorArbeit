[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercube-graph-surface"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy==2.0.2"]

[project.optional-dependencies]
visualization = [
    "open3d==0.19.0",
    "plotly==6.3.0",
    "nbformat==5.11.1",
]

[tool.setuptools]
packages = ["imports"]

name: Verify minimal bpy notebook release

on:
  workflow_dispatch:
  push:
    branches:
      - codex/minimal-bpy
    paths:
      - .github/notebook-release-validation.trigger

jobs:
  notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cp311
            python_abi: cp311-cp311
          - name: cp312
            python_abi: cp312-cp312
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Execute released notebook in a clean Jupyter kernel
        env:
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
        run: |
          docker pull "$MANYLINUX_IMAGE"
          mkdir -p "$GITHUB_WORKSPACE/bpy_minimal/notebook-validation/${{ matrix.name }}"
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repository,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/bpy_minimal/notebook-validation/${{ matrix.name }},dst=/output" \
            --workdir /output \
            -e BPY_PYTHON_ABI="${{ matrix.python_abi }}" \
            "$MANYLINUX_IMAGE" \
            /bin/bash /repository/bpy_minimal/scripts/validate_notebook_manylinux.sh

      - name: Upload notebook evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimal-bpy-notebook-${{ matrix.name }}
          path: bpy_minimal/notebook-validation/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30

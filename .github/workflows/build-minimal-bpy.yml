name: Build and verify minimal bpy

on:
  workflow_dispatch:
  push:
    branches:
      - codex/minimal-bpy
    paths:
      - .github/workflows/build-minimal-bpy.yml
      - bpy_minimal/**

concurrency:
  group: minimal-bpy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cp311-standard
            python_abi: cp311-cp311
            python_version: "3.11"
            config_profile: mesh_export.cmake
            experimental: false
          - name: cp311-no-opengl
            python_abi: cp311-cp311
            python_version: "3.11"
            config_profile: mesh_export_no_opengl.cmake
            experimental: true
          - name: cp312-standard
            python_abi: cp312-cp312
            python_version: "3.12"
            config_profile: mesh_export.cmake
            experimental: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report runner resources
        run: |
          uname -a
          lscpu
          free -h
          df -h

      - name: Reclaim unrelated runner SDK space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install host source tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git-lfs

      - name: Fetch pinned Blender sources and Linux libraries
        run: |
          chmod +x bpy_minimal/scripts/*.sh
          bpy_minimal/scripts/fetch_sources.sh "$GITHUB_WORKSPACE/bpy_minimal"

      - name: Pull and record manylinux image
        env:
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
        run: |
          docker pull "$MANYLINUX_IMAGE"
          docker image inspect "$MANYLINUX_IMAGE" \
            > bpy_minimal/reports/build-image.json

      - name: Build, test and package inside manylinux
        env:
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
        run: |
          set -o pipefail
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/bpy_minimal,dst=/work" \
            --workdir /work \
            -e BPY_BUILD_JOBS=4 \
            -e BPY_BUILD_VARIANT="${{ matrix.name }}" \
            -e BPY_PYTHON_ABI="${{ matrix.python_abi }}" \
            -e BPY_PYTHON_VERSION="${{ matrix.python_version }}" \
            -e BPY_CONFIG_PROFILE="${{ matrix.config_profile }}" \
            "$MANYLINUX_IMAGE" \
            /bin/bash /work/scripts/run_pipeline_manylinux.sh \
            2>&1 | tee bpy_minimal/logs/pipeline.log

      - name: Prepare isolated validation payload
        run: |
          mkdir -p \
            bpy_minimal/validation/input \
            bpy_minimal/validation/scripts \
            bpy_minimal/validation/tests \
            bpy_minimal/validation/build-reports \
            bpy_minimal/validation/reports
          cp bpy_minimal/dist/minimal/*.whl bpy_minimal/validation/input/
          cp bpy_minimal/scripts/verify_wheel.py bpy_minimal/validation/scripts/
          cp bpy_minimal/scripts/measure_import.py bpy_minimal/validation/scripts/
          cp bpy_minimal/scripts/generate_build_report.py bpy_minimal/validation/scripts/
          cp bpy_minimal/scripts/validate_final_manylinux.sh bpy_minimal/validation/scripts/
          cp bpy_minimal/tests/verify_blend.py bpy_minimal/validation/tests/
          cp -a bpy_minimal/reports/. bpy_minimal/validation/build-reports/

      - name: Validate final wheel without build-tree access
        env:
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
        run: |
          set -o pipefail
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/bpy_minimal/validation,dst=/validation" \
            --workdir /validation \
            -e BPY_PYTHON_ABI="${{ matrix.python_abi }}" \
            "$MANYLINUX_IMAGE" \
            /bin/bash /validation/scripts/validate_final_manylinux.sh \
            2>&1 | tee bpy_minimal/validation/reports/validation.log

      - name: Publish failure diagnostic
        if: failure()
        run: |
          {
            echo '## manylinux failure tail'
            echo
            echo '```text'
            tail -n 160 bpy_minimal/logs/pipeline.log 2>/dev/null || \
              echo 'pipeline.log was not created'
            echo
            tail -n 160 bpy_minimal/validation/reports/validation.log 2>/dev/null || \
              echo 'validation.log was not created'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence and wheel
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimal-bpy-${{ matrix.name }}
          path: |
            bpy_minimal/dist/minimal/*.whl
            bpy_minimal/reports/
            bpy_minimal/logs/
            bpy_minimal/validation/reports/
          if-no-files-found: warn
          retention-days: 7

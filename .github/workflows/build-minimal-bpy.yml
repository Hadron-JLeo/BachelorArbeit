name: Build and verify minimal bpy

on:
  workflow_dispatch:
  push:
    branches:
      - codex/minimal-bpy
    paths:
      - .github/workflows/build-minimal-bpy.yml
      - bpy_minimal/**

concurrency:
  group: minimal-bpy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report runner resources
        run: |
          uname -a
          lscpu
          free -h
          df -h

      - name: Reclaim unrelated runner SDK space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install host source tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git-lfs

      - name: Fetch pinned Blender sources and Linux libraries
        run: |
          chmod +x bpy_minimal/scripts/*.sh
          bpy_minimal/scripts/fetch_sources.sh "$GITHUB_WORKSPACE/bpy_minimal"

      - name: Pull and record manylinux image
        env:
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
        run: |
          docker pull "$MANYLINUX_IMAGE"
          docker image inspect "$MANYLINUX_IMAGE" \
            > bpy_minimal/reports/build-image.json

      - name: Build, test and package inside manylinux
        env:
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
        run: |
          set -o pipefail
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/bpy_minimal,dst=/work" \
            --workdir /work \
            -e BPY_BUILD_JOBS=4 \
            "$MANYLINUX_IMAGE" \
            /bin/bash /work/scripts/run_pipeline_manylinux.sh \
            2>&1 | tee bpy_minimal/logs/pipeline.log

      - name: Publish failure diagnostic
        if: failure()
        run: |
          {
            echo '## manylinux failure tail'
            echo
            echo '```text'
            tail -n 160 bpy_minimal/logs/pipeline.log 2>/dev/null || \
              echo 'pipeline.log was not created'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence and wheel
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimal-bpy-cp311
          path: |
            bpy_minimal/dist/raw/*.whl
            bpy_minimal/dist/minimal/*.whl
            bpy_minimal/reports/
            bpy_minimal/logs/
          if-no-files-found: warn
          retention-days: 7
